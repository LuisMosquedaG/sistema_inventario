<!-- MODAL ENTREGAR PEDIDO CON TRAZABILIDAD (LOTES / SERIES / CADUCIDADES) -->
<div class="modal fade" id="modalEntregarPedidoTrazabilidad" tabindex="-1" aria-labelledby="lblModalEntregaPedido" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 560px;">
        <div class="modal-content border-0 shadow">
            <!-- HEADER -->
            <div class="modal-header border-bottom bg-white py-2 px-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-brand fs-5"><i class="bi bi-box-seam"></i></span>
                    <h6 class="modal-title fw-bold text-dark mb-0" id="lblModalEntregaPedido">
                        Entregar Pedido <span id="lblFolioPedidoModal" class="text-brand"></span>
                    </h6>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- SUB-BARRA ALMACÉN / CLIENTE / SUCURSAL -->
            <div class="px-3 py-2 bg-light border-bottom d-flex flex-wrap align-items-center justify-content-between small text-muted">
                <div>
                    Cliente: <span id="entrega_cliente_display" class="fw-semibold text-dark">--</span>
                    <span class="mx-1">•</span>
                    Sucursal: <span id="entrega_sucursal_display" class="fw-semibold text-dark">Principal</span>
                </div>
                <div class="d-flex align-items-center gap-1">
                    <span>Almacén:</span>
                    <select id="entrega_almacen_select" class="form-select form-select-sm py-0 px-2 fw-semibold text-dark border bg-white shadow-none" 
                            style="width: auto; height: 26px; font-size: 0.78rem; background-image: none !important; padding-right: 8px !important; cursor: pointer;" 
                            onchange="onCambiarAlmacenEntrega(this.value)">
                        <!-- Cargado dinámicamente -->
                    </select>
                </div>
            </div>

            <!-- BODY: SOLO LAS PARTIDAS EN LIMPIO -->
            <div class="modal-body p-3 bg-white" style="max-height: 65vh; overflow-y: auto;">
                <input type="hidden" id="entrega_pedido_id" value="">
                <div id="contenedor_partidas_entrega" class="d-flex flex-column gap-3">
                    <!-- Partidas generadas dinámicamente -->
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer border-top bg-white py-2 px-3 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-light text-secondary btn-sm px-3" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="btn btn-brand btn-sm px-3 text-white shadow-sm fw-bold" id="btnConfirmarEntregaPedido" onclick="confirmarEntregaPedidoFinal()">
                    <i class="bi bi-check2-circle me-1"></i> Entregar Pedido
                </button>
            </div>
        </div>
    </div>
</div>
