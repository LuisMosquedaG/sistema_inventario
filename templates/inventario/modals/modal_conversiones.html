<!-- MODAL: GESTIONAR CONVERSIONES DE UNIDAD (PRESENTACIONES MÚLTIPLES) -->
<style>
    .btn-delete-conv {
        color: #adb5bd;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 4px;
    }
    .btn-delete-conv:hover {
        color: #dc3545 !important;
        transform: scale(1.15);
    }
    .btn-edit-conv {
        color: #adb5bd;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 4px;
    }
    .btn-edit-conv:hover {
        color: #00b8b9 !important;
        transform: scale(1.15);
    }
    .conv-pill-stock {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.6rem;
        border-radius: 50px;
        background-color: rgba(0, 184, 185, 0.12);
        color: #007b7c;
        font-weight: 600;
        font-size: 0.75rem;
        border: 1px solid rgba(0, 184, 185, 0.25);
    }
    .conv-barcode-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background-color: #f1f3f5;
        color: #495057;
        font-family: monospace;
        font-size: 0.75rem;
    }
</style>

<div class="modal fade modal-sheet" id="modalConversiones" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <!-- HEADER -->
            <div class="modal-header border-bottom bg-white py-2 px-3">
                <div>
                    <h5 class="modal-title fw-bold mb-0 text-dark" id="modalConversionesTitulo">
                        <i class="bi bi-arrow-left-right me-2 text-brand"></i>Conversiones de Unidad
                    </h5>
                    <div class="small text-muted" id="modalConversionesSubtitulo">
                        Configura presentaciones de venta para artículos de tipo Stock.
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <!-- BODY -->
            <div class="modal-body p-3 bg-light">
                <!-- INFO BANNER (TABLA) -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="table-responsive bg-white rounded">
                        <table class="table table-sm table-borderless align-middle mb-0">
                            <thead class="bg-light border-bottom">
                                <tr>
                                    <th class="text-dark small text-uppercase fw-bold text-center text-nowrap py-2" style="font-size: 0.68rem; letter-spacing: 0.5px; width: 16%;">Clave</th>
                                    <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px; width: 34%;">Nombre</th>
                                    <th class="text-dark small text-uppercase fw-bold text-center text-nowrap py-2" style="font-size: 0.68rem; letter-spacing: 0.5px; width: 20%;">Unidad de Medida</th>
                                    <th class="text-dark small text-uppercase fw-bold text-center text-nowrap py-2" style="font-size: 0.68rem; letter-spacing: 0.5px; width: 15%;">Costo Base</th>
                                    <th class="text-dark small text-uppercase fw-bold text-center text-nowrap py-2" style="font-size: 0.68rem; letter-spacing: 0.5px; width: 15%;">Existencias</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="text-center py-2">
                                        <div class="text-muted small" style="font-size: 0.75rem;" id="infoConvProductoClave">--</div>
                                    </td>
                                    <td class="text-center py-2">
                                        <div class="text-muted small" style="font-size: 0.75rem;" id="infoConvProductoNombre">--</div>
                                    </td>
                                    <td class="text-center py-2">
                                        <div class="text-muted small" style="font-size: 0.75rem;" id="infoConvUnidadBase">--</div>
                                    </td>
                                    <td class="text-center py-2">
                                        <div class="text-muted small" style="font-size: 0.75rem;" id="infoConvCostoBase">$0.00</div>
                                    </td>
                                    <td class="text-center py-2">
                                        <div class="text-muted small" style="font-size: 0.75rem;" id="infoConvStockTotal">0.00</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- FORMULARIO AGREGAR / EDITAR -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body p-3 bg-white rounded">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-uppercase text-dark fw-bold mb-0" id="tituloFormConversion" style="font-size: 0.72rem; letter-spacing: 1px;">
                                <i class="bi bi-plus-circle me-1 text-brand"></i>Nueva Conversión de Presentación
                            </h6>
                            <button type="button" class="btn btn-link btn-sm text-decoration-none text-muted p-0 d-none" id="btnCancelarEdicionConv" onclick="cancelarEdicionConversion()">
                                <i class="bi bi-x-circle me-1"></i>Cancelar Edición
                            </button>
                        </div>
                        
                        <form id="formConversion" class="row g-2 align-items-end">
                            {% csrf_token %}
                            <input type="hidden" id="conv_producto_id" name="producto_id">
                            <input type="hidden" id="conv_id" name="conversion_id">
                            
                            <!-- UNIDAD DESTINO -->
                            <div class="col-md-3">
                                <label class="form-label text-dark small text-uppercase fw-bold mb-1" style="font-size: 0.68rem; letter-spacing: 0.5px;">Conversión*</label>
                                <select class="form-select form-select-sm" id="conv_unidad_destino" name="unidad_destino" required>
                                    <option value="">Selecciona unidad SAT...</option>
                                    <option value="XBX" data-nombre="Caja">XBX (Caja)</option>
                                    <option value="XPK" data-nombre="Paquete">XPK (Paquete)</option>
                                    <option value="DZN" data-nombre="Docena">DZN (Docena)</option>
                                    <option value="XPL" data-nombre="Tarima / Pallet">XPL (Tarima / Pallet)</option>
                                    <option value="H87" data-nombre="Pieza">H87 (Pieza)</option>
                                    <option value="XSA" data-nombre="Saco">XSA (Saco / Costal)</option>
                                    <option value="XRO" data-nombre="Rollo">XRO (Rollo)</option>
                                    <option value="XKI" data-nombre="Kit">XKI (Kit)</option>
                                    <option value="XLT" data-nombre="Lote">XLT (Lote)</option>
                                    <option value="XBA" data-nombre="Barril">XBA (Barril)</option>
                                    <option value="KGM" data-nombre="Kilogramo">KGM (Kilogramo)</option>
                                    <option value="GRM" data-nombre="Gramo">GRM (Gramo)</option>
                                    <option value="LTR" data-nombre="Litro">LTR (Litro)</option>
                                    <option value="MLT" data-nombre="Mililitro">MLT (Mililitro)</option>
                                    <option value="MTR" data-nombre="Metro">MTR (Metro)</option>
                                    <option value="MTK" data-nombre="Metro cuadrado">MTK (Metro cuadrado)</option>
                                    <option value="MTQ" data-nombre="Metro cúbico">MTQ (Metro cúbico)</option>
                                    <option value="E48" data-nombre="Servicio">E48 (Unidad de servicio)</option>
                                </select>
                            </div>
                            
                            <!-- FACTOR DE EQUIVALENCIA -->
                            <div class="col-md-3">
                                <label class="form-label text-dark small text-uppercase fw-bold mb-1" style="font-size: 0.68rem; letter-spacing: 0.5px;">Equivalencia*</label>
                                <div class="input-group input-group-sm">
                                    <input type="number" step="0.0001" min="0.0001" class="form-control form-control-sm" id="conv_factor_equivalencia" name="factor_equivalencia" placeholder="100.00" required>
                                    <span class="input-group-text small text-muted px-2" id="addonConvUnidadBase">u.</span>
                                </div>
                            </div>

                            <!-- PRECIO VENTA -->
                            <div class="col-md-3">
                                <label class="form-label text-dark small text-uppercase fw-bold mb-1" style="font-size: 0.68rem; letter-spacing: 0.5px;">Precio Venta ($)</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text small px-2">$</span>
                                    <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="conv_precio_venta" name="precio_venta" placeholder="Sugerido">
                                </div>
                            </div>

                            <!-- CODIGO BARRAS -->
                            <div class="col-md-2">
                                <label class="form-label text-dark small text-uppercase fw-bold mb-1" style="font-size: 0.68rem; letter-spacing: 0.5px;">Código de Barras</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text small px-2"><i class="bi bi-upc"></i></span>
                                    <input type="text" class="form-control form-control-sm" id="conv_codigo_barras" name="codigo_barras" placeholder="Opcional">
                                </div>
                            </div>

                            <!-- BOTÓN GUARDAR -->
                            <div class="col-md-1 text-end">
                                <button type="submit" class="btn btn-sm btn-brand w-100 d-inline-flex align-items-center justify-content-center" id="btnGuardarConversion" style="height: 31px;" title="Guardar Conversión">
                                    <i class="bi bi-plus-lg fs-6"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- TABLA DE CONVERSIONES CONFIGURADAS -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive bg-white rounded">
                            <table class="table table-sm table-hover mb-0" id="tablaConversiones">
                                <thead class="bg-light border-bottom">
                                    <tr>
                                        <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px;">Conversión</th>
                                        <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px;">Equivalencia</th>
                                        <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px;">Stock Calculado</th>
                                        <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px;">Precio Venta</th>
                                        <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px;">Código de Barras</th>
                                        <th class="text-dark small text-uppercase fw-bold text-center py-2" style="font-size: 0.68rem; letter-spacing: 0.5px; width: 80px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="listaConversionesCuerpo">
                                    <!-- Se llena vía JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- FOOTER -->
            <div class="modal-footer bg-white border-top py-2">
                <button type="button" class="btn btn-light text-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script>
    let modalConversionesInstancia = null;
    let productoBaseActual = null;

    function abrirModalConversiones(productoId, productoNombre, productoUnidad, productoCosto = 0, productoClave = '') {
        document.getElementById('conv_producto_id').value = productoId;
        document.getElementById('infoConvProductoNombre').innerText = productoNombre || '--';
        document.getElementById('infoConvProductoClave').innerText = productoClave || '--';
        document.getElementById('infoConvUnidadBase').innerText = productoUnidad || 'Pz';
        const costoNum = parseFloat(productoCosto) || 0;
        document.getElementById('infoConvCostoBase').innerText = `$${costoNum.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('infoConvStockTotal').innerText = '--';
        const elLblBase = document.getElementById('lblConvUnidadBase');
        if (elLblBase) elLblBase.innerText = productoUnidad || 'Base';
        document.getElementById('addonConvUnidadBase').innerText = productoUnidad || 'u.';
        
        cancelarEdicionConversion();
        cargarConversionesDeProducto(productoId);

        if (!modalConversionesInstancia) {
            modalConversionesInstancia = new bootstrap.Modal(document.getElementById('modalConversiones'));
        }
        modalConversionesInstancia.show();
    }

    function cargarConversionesDeProducto(productoId) {
        const tbody = document.getElementById('listaConversionesCuerpo');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3 text-muted"><div class="spinner-border spinner-border-sm text-brand" role="status"></div> Cargando conversiones...</td></tr>';
        
        fetch(`/inventario/api/conversiones/${productoId}/`)
        .then(res => res.json())
        .then(data => {
            if (!data.success) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-danger">Error: ${data.error}</td></tr>`;
                return;
            }

            productoBaseActual = data.producto;
            document.getElementById('infoConvProductoNombre').innerText = data.producto.nombre;
            document.getElementById('infoConvProductoClave').innerText = data.producto.clave || '--';
            document.getElementById('infoConvUnidadBase').innerText = data.producto.unidad_medida;
            const costoBase = parseFloat(data.producto.precio_costo || 0);
            document.getElementById('infoConvCostoBase').innerText = `$${costoBase.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            const elLblBase2 = document.getElementById('lblConvUnidadBase');
            if (elLblBase2) elLblBase2.innerText = data.producto.unidad_medida;
            document.getElementById('addonConvUnidadBase').innerText = data.producto.unidad_medida_code || 'u.';
            document.getElementById('infoConvStockTotal').innerText = parseFloat(data.producto.stock_total).toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 2});

            // Deshabilitar la opción de la unidad base del artículo en el selector para evitar errores
            const baseCode = data.producto.unidad_medida_code;
            const selectEl = document.getElementById('conv_unidad_destino');
            Array.from(selectEl.options).forEach(opt => {
                if (opt.value && (opt.value === baseCode || opt.value === data.producto.unidad_medida)) {
                    opt.disabled = true;
                    if (!opt.text.includes('(Unidad Base actual)')) {
                        opt.text = opt.text + ' (Unidad Base actual)';
                    }
                } else if (opt.value) {
                    opt.disabled = false;
                    opt.text = opt.text.replace(' (Unidad Base actual)', '');
                }
            });

            // Auto-sugerir cálculo en el formulario
            actualizarPrecioSugerido();

            tbody.innerHTML = '';
            if (!data.conversiones || data.conversiones.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-3 d-block text-secondary opacity-50 mb-1"></i>
                            No hay conversiones configuradas para este artículo.<br>
                            <span class="small">Agrega presentaciones (ej. Caja de 100 Pz) para vender en distintas unidades.</span>
                        </td>
                    </tr>
                `;
                return;
            }

            data.conversiones.forEach(c => {
                const precioStr = c.precio_venta ? `$${parseFloat(c.precio_venta).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : '--';
                const barcodeHtml = c.codigo_barras 
                    ? `<span class="conv-barcode-pill"><i class="bi bi-upc"></i> ${c.codigo_barras}</span>` 
                    : '<span class="text-muted small">--</span>';
                const stockVal = parseFloat(c.stock_calculado || 0).toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                const unidadNombre = c.unidad_destino_nombre || c.unidad_destino;
                const stockTextoSimple = `${stockVal} ${unidadNombre}`;

                tbody.innerHTML += `
                    <tr>
                        <td class="text-center align-middle">
                            ${c.unidad_destino_display || c.unidad_destino}
                        </td>
                        <td class="text-center align-middle">
                            1 ${c.unidad_destino_nombre || c.unidad_destino} = ${parseFloat(c.factor_equivalencia)} ${data.producto.unidad_medida}
                        </td>
                        <td class="text-center align-middle">
                            ${stockTextoSimple}
                        </td>
                        <td class="text-center align-middle">
                            ${precioStr}
                        </td>
                        <td class="text-center align-middle">
                            ${barcodeHtml}
                        </td>
                        <td class="text-center align-middle">
                            <span onclick="cargarEdicionConversion(${c.id}, '${escapeQuotes(c.unidad_destino)}', ${c.factor_equivalencia}, ${c.precio_venta_raw !== null ? c.precio_venta_raw : 'null'}, '${escapeQuotes(c.codigo_barras)}')" class="btn-edit-conv me-1" title="Editar">
                                <i class="bi bi-pencil-square fs-6"></i>
                            </span>
                            <span onclick="eliminarConversion(${c.id}, ${productoId})" class="btn-delete-conv" title="Eliminar">
                                <i class="bi bi-x-circle fs-6"></i>
                            </span>
                        </td>
                    </tr>
                `;
            });
        })
        .catch(err => {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-danger">Error de conexión: ${err.message}</td></tr>`;
        });
    }

    function escapeQuotes(str) {
        if (!str) return '';
        return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function cargarEdicionConversion(id, unidadDestino, factor, precioVenta, codigoBarras) {
        document.getElementById('conv_id').value = id;
        
        const selectEl = document.getElementById('conv_unidad_destino');
        let found = false;
        for (let i = 0; i < selectEl.options.length; i++) {
            const opt = selectEl.options[i];
            if (opt.value === unidadDestino || opt.text === unidadDestino || (opt.dataset.nombre && opt.dataset.nombre.toLowerCase() === unidadDestino.toLowerCase())) {
                selectEl.selectedIndex = i;
                found = true;
                break;
            }
        }
        if (!found) {
            const newOpt = new Option(unidadDestino, unidadDestino, true, true);
            selectEl.add(newOpt);
        }

        document.getElementById('conv_factor_equivalencia').value = factor;
        document.getElementById('conv_precio_venta').value = (precioVenta !== null && precioVenta !== undefined) ? precioVenta : '';
        document.getElementById('conv_codigo_barras').value = codigoBarras || '';

        document.getElementById('tituloFormConversion').innerHTML = '<i class="bi bi-pencil-square me-1 text-brand"></i>Editar Conversión';
        document.getElementById('btnCancelarEdicionConv').classList.remove('d-none');
        
        const btnSave = document.getElementById('btnGuardarConversion');
        btnSave.innerHTML = '<i class="bi bi-check-lg fs-6"></i>';
        btnSave.title = "Actualizar Conversión";

        actualizarPrecioSugerido();
    }

    function cancelarEdicionConversion() {
        document.getElementById('conv_id').value = '';
        document.getElementById('formConversion').reset();
        document.getElementById('conv_unidad_destino').selectedIndex = 0;
        document.getElementById('tituloFormConversion').innerHTML = '<i class="bi bi-plus-circle me-1 text-brand"></i>Nueva Conversión de Presentación';
        document.getElementById('btnCancelarEdicionConv').classList.add('d-none');
        
        const btnSave = document.getElementById('btnGuardarConversion');
        btnSave.innerHTML = '<i class="bi bi-plus-lg fs-6"></i>';
        btnSave.title = "Guardar Conversión";

        actualizarPrecioSugerido();
    }

    function actualizarPrecioSugerido() {
        const precioInput = document.getElementById('conv_precio_venta');
        const factor = parseFloat(document.getElementById('conv_factor_equivalencia').value);
        const costoBase = productoBaseActual ? parseFloat(productoBaseActual.precio_costo || 0) : 0;

        if (factor > 0 && costoBase > 0) {
            const precioSugerido = (factor * costoBase).toFixed(2);
            precioInput.placeholder = `$${precioSugerido} (Sugerido)`;
        } else {
            precioInput.placeholder = "Sugerido";
        }
    }

    document.getElementById('conv_factor_equivalencia').addEventListener('input', actualizarPrecioSugerido);

    document.getElementById('formConversion').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const productoId = document.getElementById('conv_producto_id').value;
        const formData = new FormData(this);
        const btn = document.getElementById('btnGuardarConversion');
        const origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"></div>';

        fetch('/inventario/api/conversiones/guardar/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            btn.disabled = false;
            btn.innerHTML = origHtml;
            if (data.success) {
                cancelarEdicionConversion();
                cargarConversionesDeProducto(productoId);
            } else {
                alert("Error: " + data.error);
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerHTML = origHtml;
            alert("Error al guardar: " + err.message);
        });
    });

    function eliminarConversion(conversionId, productoId) {
        if (!confirm('¿Estás seguro de eliminar esta conversión de presentación?')) return;
        
        const csrfToken = document.querySelector('#formConversion [name=csrfmiddlewaretoken]').value;
        const formData = new FormData();
        formData.append('csrfmiddlewaretoken', csrfToken);

        fetch(`/inventario/api/conversiones/eliminar/${conversionId}/`, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                cancelarEdicionConversion();
                cargarConversionesDeProducto(productoId);
            } else {
                alert("Error al eliminar: " + data.error);
            }
        })
        .catch(err => {
            alert("Error de conexión: " + err.message);
        });
    }
</script>
