<div class="modal fade" id="modalCrearArticulo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-sheet">
        <div class="modal-content">
            <div class="modal-header border-bottom bg-light py-2"> 
                <h5 class="modal-title fw-bold">Nuevo Artículo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body bg-light">
                <style>
                    /* Switches color marca */
                    #modalCrearArticulo .form-check-input:checked {
                        background-color: #00b8b9 !important;
                        border-color: #00b8b9 !important;
                    }
                    /* Resaltado de secciones al pasar el puntero */
                    #modalCrearArticulo .card-section-articulo {
                        border: 1px solid #e9ecef !important;
                        transition: border-color 0.2s ease, box-shadow 0.2s ease;
                    }
                    #modalCrearArticulo .card-section-articulo:hover {
                        border-color: #00b8b9 !important;
                        box-shadow: 0 0 0 1px rgba(0, 184, 185, 0.2) !important;
                    }
                    /* Chips de Códigos de Barras */
                    #modalCrearArticulo .barcode-chip {
                        background-color: rgba(0, 184, 185, 0.14) !important;
                        color: #007b7c !important;
                        border: 1px solid rgba(0, 184, 185, 0.35) !important;
                        border-radius: 6px;
                        font-size: 0.8rem;
                        font-weight: 600;
                        font-family: var(--bs-font-monospace, monospace);
                        display: inline-flex;
                        align-items: center;
                        gap: 0.35rem;
                        padding: 0.25rem 0.55rem;
                    }
                    #modalCrearArticulo .barcode-chip .btn-remove-barcode {
                        cursor: pointer;
                        color: #007b7c;
                        opacity: 0.7;
                        transition: all 0.15s ease;
                    }
                    #modalCrearArticulo .barcode-chip .btn-remove-barcode:hover {
                        color: #e03131 !important;
                        opacity: 1 !important;
                    }
                </style>
                <form id="formCrearArticulo" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="producto_id" id="productoId" value="">
                    <input type="hidden" name="sucursal" id="hiddenSucursalArticulo" value="">
                    
                    <!-- SECCIÓN 1: IDENTIFICACIÓN -->
                    <div class="card card-section-articulo shadow-sm mb-2">
                        <div class="card-body p-2">
                            <h6 class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">1. Identificación</h6>
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold text-secondary mb-1">Clave</label>
                                    <input type="text" name="clave" id="inputClave" class="form-control form-control-sm" placeholder="Ej. LAP-001">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label small fw-bold text-secondary mb-1">Nombre <span class="text-danger">*</span></label>
                                    <input type="text" name="nombre" class="form-control form-control-sm" placeholder="Ej. Laptop Dell Latitude" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary mb-1">Tipo</label>
                                    <select name="tipo" class="form-select form-select-sm">
                                        <option value="producto">Producto</option>
                                        <option value="servicio">Servicio</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small text-muted mb-1">Descripción</label>
                                    <textarea name="descripcion" class="form-control form-control-sm" rows="1" placeholder="Detalles adicionales..."></textarea>
                                </div>
                            </div> <!-- Closing first row -->

                            <div class="row g-2 mt-2"> <!-- Added mt-2 for spacing and closed previous row -->
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary mb-1">Estado</label>
                                    <select name="estado" class="form-select form-select-sm">
                                        <option value="activo" selected>Activo</option>
                                        <option value="inactivo">Inactivo</option>
                                        <option value="descontinuado">Descontinuado</option>
                                        <option value="revision">Revisión</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary mb-1">Tipo de Abastecimiento</label>
                                    <select name="tipo_abastecimiento" id="selectAbastecimiento" class="form-select form-select-sm" onchange="toggleTestCalidad()">
                                        <option value="compra" selected>Compra</option>
                                        <option value="stock">Stock</option>
                                        <option value="produccion">Producción (requiere receta)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary mb-1">Test de Calidad</label>
                                    <select name="test_calidad" id="selectTestCalidad" class="form-select form-select-sm" disabled>
                                        <option value="">-- Sin Test --</option>
                                        {% for t in tests_calidad %}
                                            <option value="{{ t.id }}">{{ t.nombre }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <script>
                        function toggleTestCalidad() {
                            const val = document.getElementById('selectAbastecimiento').value;
                            const selectTest = document.getElementById('selectTestCalidad');
                            if (val === 'produccion') {
                                selectTest.disabled = false;
                                selectTest.classList.remove('bg-light'); // Le quitamos el sombreado
                            } else {
                                selectTest.disabled = true;
                                selectTest.value = "";
                                selectTest.classList.add('bg-light'); // Lo sombreamos como la subcategoría
                            }
                        }
                    </script>

                    <!-- SECCIÓN 2: CLASIFICACIÓN -->
                    <div class="card card-section-articulo shadow-sm mb-2">
                        <div class="card-body p-2">
                            <h6 class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">2. Clasificación</h6>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label small text-muted mb-1">Categoría</label>
                                    <div class="d-flex align-items-center">
                                        <select name="categoria" id="selectCategoria" class="form-select form-select-sm" style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
                                            <option value="">Seleccionar...</option>
                                            {% for cat in categorias %}
                                                <option value="{{ cat.nombre }}">{{ cat.nombre }}</option>
                                            {% endfor %}
                                        </select>
                                        <button type="button" class="btn btn-brand btn-sm shadow-none" 
                                                style="height: 31px; width: 31px; border-radius: 0 0.25rem 0.25rem 0; display: flex; align-items: center; justify-content: center; padding: 0; margin-left: -1px; border-left: none;" 
                                                onclick="prepararNuevaCategoriaRapida(false); new bootstrap.Modal(document.getElementById('modalCrearCategoriaRapida')).show();"
                                                title="Nueva Categoría">
                                            <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label small text-muted mb-1">Subcategoría</label>
                                    <div class="d-flex align-items-center">
                                        <select name="subcategoria" id="selectSubcategoria" class="form-select form-select-sm" disabled style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
                                            <option value="">Selecciona categoría primero...</option>
                                        </select>
                                        <button type="button" class="btn btn-brand btn-sm shadow-none" 
                                                style="height: 31px; width: 31px; border-radius: 0 0.25rem 0.25rem 0; display: flex; align-items: center; justify-content: center; padding: 0; margin-left: -1px; border-left: none;" 
                                                onclick="const selectCat = document.getElementById('selectCategoria'); if (!selectCat || !selectCat.value) { alert('⚠️ Selecciona primero una categoría para poder agregarle una subcategoría.'); } else { prepararNuevaCategoriaRapida(true); new bootstrap.Modal(document.getElementById('modalCrearCategoriaRapida')).show(); }"
                                                title="Nueva Subcategoría">
                                            <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label small text-muted mb-1">Marca</label>
                                    <input type="text" name="marca" class="form-control form-control-sm">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small text-muted mb-1">Modelo</label>
                                    <input type="text" name="modelo" class="form-control form-control-sm">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small text-muted mb-1">Línea</label>
                                    <input type="text" name="linea" class="form-control form-control-sm">
                                </div>
                                <!-- Fila para incluir Unidad, IVA (%) e IEPS (%) -->
                                <div class="col-md-4">
                                    <label class="form-label small text-muted mb-1">Unidad</label>
                                    <select name="unidad_medida" id="selectUnidad" class="form-select form-select-sm">
                                        <option value="H87">H87 (Pieza)</option>
                                        <option value="XBX">XBX (Caja)</option>
                                        <option value="XPK">XPK (Paquete)</option>
                                        <option value="DZN">DZN (Docena)</option>
                                        <option value="XPL">XPL (Tarima / Pallet)</option>
                                        <option value="XSA">XSA (Saco / Costal)</option>
                                        <option value="XRO">XRO (Rollo)</option>
                                        <option value="XKI">XKI (Kit)</option>
                                        <option value="XLT">XLT (Lote)</option>
                                        <option value="XBA">XBA (Barril)</option>
                                        <option value="KGM">KGM (Kilogramo)</option>
                                        <option value="GRM">GRM (Gramo)</option>
                                        <option value="LTR">LTR (Litro)</option>
                                        <option value="MLT">MLT (Mililitro)</option>
                                        <option value="MTR">MTR (Metro)</option>
                                        <option value="MTK">MTK (Metro cuadrado)</option>
                                        <option value="MTQ">MTQ (Metro cúbico)</option>
                                        <option value="E48">E48 (Unidad de servicio)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small text-muted mb-1">IVA (%)</label>
                                    <input type="number" step="0.01" name="iva" id="inputIVA" class="form-control form-control-sm" value="16" oninput="actualizarCalculosPrecios()" onchange="actualizarCalculosPrecios()">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small text-muted mb-1">IEPS (%)</label>
                                    <input type="number" step="0.01" name="ieps" class="form-control form-control-sm" value="0" placeholder="0.00">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: INVENTARIO Y PRECIOS -->
                    <div class="card card-section-articulo shadow-sm mb-2">
                        <div class="card-body p-2">
                            <h6 class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">3. Inventario y Precios</h6>
                            
                            <!-- LINEA 1: COSTO, VENTA Y CALCULADOS -->
                            <div class="row g-2 mb-2">
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold text-secondary mb-1">Costo <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-sm">
                                        <input type="number" step="0.01" name="precio_costo" id="inputPrecioCosto" class="form-control" required oninput="actualizarCalculosPrecios()">
                                        <select class="form-select" id="selectMonedaCosto" onchange="actualizarCalculosPrecios()" style="max-width: 85px; font-size: 0.75rem;">
                                            <option value="1.0000" data-siglas="MXN">MXN</option>
                                            {% for m in monedas %}
                                                {% if m.siglas != 'MXN' %}
                                                    <option value="{{ m.factor }}" data-siglas="{{ m.siglas }}">{{ m.siglas }}</option>
                                                {% endif %}
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold text-secondary mb-1">Venta <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-sm">
                                        <input type="number" step="0.01" name="precio_venta" id="inputPrecioVenta" class="form-control" required oninput="actualizarCalculosPrecios()">
                                        <select class="form-select" id="selectMonedaVenta" onchange="actualizarCalculosPrecios()" style="max-width: 85px; font-size: 0.75rem;">
                                            <option value="1.0000" data-siglas="MXN">MXN</option>
                                            {% for m in monedas %}
                                                {% if m.siglas != 'MXN' %}
                                                    <option value="{{ m.factor }}" data-siglas="{{ m.siglas }}">{{ m.siglas }}</option>
                                                {% endif %}
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-2 text-center">
                                    <label class="form-label small fw-bold text-secondary mb-1">IVA </label>
                                    <div class="py-1 text-dark" id="infoIVAMonto" style="font-size: 0.85rem;">$0.00</div>
                                </div>
                                <div class="col-md-2 text-center">
                                    <label class="form-label small fw-bold text-secondary mb-1">Total (Venta+IVA)</label>
                                    <div class="py-1 text-dark" id="infoTotalVenta" style="font-size: 0.85rem;">$0.00</div>
                                </div>
                                <div class="col-md-2 text-center">
                                    <label class="form-label small fw-bold text-secondary mb-1">Margen %</label>
                                    <div class="py-1 text-dark" id="infoMargenPrec" style="font-size: 0.85rem;">0.0%</div>
                                </div>
                            </div>

                            <!-- LINEA 2: STOCK -->
                            <div class="row g-2 mb-2">
                                <div class="col-md-6">
                                    <label class="form-label small text-muted mb-1">Stock Mínimo</label>
                                    <input type="number" name="stock_minimo" class="form-control form-control-sm" value="0">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small text-muted mb-1">Stock Máximo</label>
                                    <input type="number" name="stock_maximo" class="form-control form-control-sm" value="1000">
                                </div>
                            </div>

                            <!-- LINEA 3: SWITCHES -->
                            <div class="row g-2 pt-1">
                                <div class="col-12 d-flex justify-content-around flex-wrap gap-2 py-1">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="maneja_lote" id="checkLote">
                                        <label class="form-check-label small text-muted fw-bold" for="checkLote">Lote</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="maneja_serie" id="checkSerie">
                                        <label class="form-check-label small text-muted fw-bold" for="checkSerie">Serie</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="maneja_caducidad" id="checkCaducidad">
                                        <label class="form-check-label small text-muted fw-bold" for="checkCaducidad">Caducidad</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="maneja_fifo" id="checkFIFO" onchange="toggleFifoLifo('fifo')">
                                        <label class="form-check-label small text-muted fw-bold" for="checkFIFO" title="Primeras Entradas, Primeras Salidas">FIFO</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="maneja_lifo" id="checkLIFO" onchange="toggleFifoLifo('lifo')">
                                        <label class="form-check-label small text-muted fw-bold" for="checkLIFO" title="Últimas Entradas, Primeras Salidas">LIFO</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="maneja_fefo" id="checkFEFO" onchange="toggleFifoLifo('fefo')">
                                        <label class="form-check-label small text-muted fw-bold" for="checkFEFO" title="Primero que Caduca, Primero que Sale">FEFO</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="tiene_iva" id="checkIVA" checked onchange="toggleIVA(); actualizarCalculosPrecios();">
                                        <label class="form-check-label small text-muted fw-bold" for="checkIVA">IVA</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="mostrar_en_pos" id="checkMostrarPOS" checked>
                                        <label class="form-check-label small text-muted fw-bold" for="checkMostrarPOS">POS</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="permitir_modificadores" id="checkPermitirModificadores">
                                        <label class="form-check-label small text-muted fw-bold" for="checkPermitirModificadores">Modif.</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIONES 4 Y 5: IMAGEN Y CÓDIGOS DE BARRAS ALTERNATIVOS -->
                    <div class="row g-2 mb-2">
                        <!-- Lado Izquierdo: Imagen del Artículo -->
                        <div class="col-md-6">
                            <div class="card card-section-articulo shadow-sm h-100">
                                <div class="card-body p-2">
                                    <h6 class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">4. Imagen del Artículo</h6>
                                    <div class="row g-2 align-items-center">
                                        <div class="col-auto">
                                            <label class="form-label small text-muted mb-1 d-block">Subir Imagen</label>
                                            <div class="d-flex align-items-center gap-1">
                                                <input type="file" name="imagen" id="inputImagenArticulo" class="d-none" accept="image/*">
                                                <button type="button" class="btn btn-light border btn-sm text-secondary px-3" onclick="document.getElementById('inputImagenArticulo').click()">
                                                    <i class="bi bi-upload me-1"></i> Seleccionar archivo
                                                </button>
                                                <input type="hidden" name="eliminar_imagen" id="eliminarImagenArticulo" value="false">
                                                <button type="button" id="btnEliminarImagenArticulo" class="btn btn-outline-danger btn-sm d-none" 
                                                        style="height: 31px; width: 31px; display: flex; align-items: center; justify-content: center; padding: 0;" 
                                                        onclick="eliminarFotoArticulo()"
                                                        title="Eliminar Foto">
                                                    <i class="bi bi-dash-lg" style="font-size: 1.2rem; font-weight: bold;"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="col text-center">
                                            <div id="previewImagenArticuloContainer" class="border rounded bg-white d-flex align-items-center justify-content-center" style="height: 70px; width: 100%; max-width: 110px; margin: 0 auto; overflow: hidden; position: relative;">
                                                <span class="text-muted small" id="previewImagenArticuloPlaceholder" style="font-size: 0.7rem;">Sin Imagen</span>
                                                <img src="" id="previewImagenArticulo" class="d-none w-100 h-100" style="object-fit: contain;">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Lado Derecho: Códigos de Barras Alternativos -->
                        <div class="col-md-6">
                            <div class="card card-section-articulo shadow-sm h-100">
                                <div class="card-body p-2">
                                    <h6 class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">5. Códigos de Barras Alternativos</h6>
                                    <label class="form-label small text-muted mb-1">Escanear o ingresar código de barras</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="inputBarcodeAlternativo" class="form-control" placeholder="Ej. 7501055300010" onkeydown="if(event.key === 'Enter') { event.preventDefault(); agregarBarcodeLista(); }">
                                        <button type="button" class="btn btn-brand btn-sm text-white px-3" onclick="agregarBarcodeLista()">Agregar</button>
                                    </div>
                                    <div class="mt-2">
                                        <div id="barcodesContainer" class="d-flex flex-wrap gap-2 py-1">
                                            <!-- Aquí se renderizarán los chips -->
                                        </div>
                                        <!-- Inputs ocultos para envío del formulario -->
                                        <div id="barcodesHiddenInputs"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer border-top bg-white py-2">
                <button type="button" class="btn btn-light text-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-brand btn-sm px-4" onclick="guardarProducto()">Guardar Artículo</button>
            </div>
        </div>
    </div>
</div>
