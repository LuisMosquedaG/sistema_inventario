<!-- MODAL: VER COMPRA -->
<div class="modal fade" id="modalVerCompra" tabindex="-1" aria-hidden="true">

            <!-- HEADER -->
            <div class="modal-header border-bottom bg-light">
                <div class="d-flex align-items-center gap-2">

                        <i class="bi bi-eye me-2" style="color: #00b8b9;"></i>

                    </h5>
                    <span id="ver_compra_estado" class="status-pill"></span>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-3 bg-light">
                <div class="d-flex flex-column flex-xl-row gap-3">

                    <div class="flex-grow-1" style="min-width: 0;">
                        <!-- SECCIÓN 1: DATOS DE COMPRA -->
                        <div class="card border-0 shadow-sm mb-3" style="border-left: 4px solid #00b8b9 !important;">
                            <div class="card-body p-3">
                                <h6 class="text-uppercase text-muted fw-bold mb-3" style="font-size: 0.75rem; letter-spacing: 1px;">Datos de Compra</h6>
                                <div class="row g-3">
                                    
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary mb-0">Proveedor</label>
                                        <div id="ver_compra_proveedor" class="text-dark fw-semibold">--</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary mb-0">Sucursal de Proveedor</label>
                                        <div id="ver_compra_sucursal" class="text-dark fw-semibold">--</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary mb-0">Fecha de OC</label>
                                        <div id="ver_compra_fecha" class="text-dark">--</div>
                                    </div>
                                    
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary mb-0">Tipo de Moneda</label>
                                        <div id="ver_compra_moneda" class="text-dark">--</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary mb-0">TC</label>
                                        <div id="ver_compra_tc" class="text-dark">--</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary mb-0">Almacén de Entrada</label>
                                        <div id="ver_compra_almacen" class="text-dark">--</div>
                                    </div>

                                    <div class="col-md-12">
                                        <label class="form-label small fw-bold text-secondary mb-0">Notas</label>
                                        <div id="ver_compra_notas" class="text-dark small">--</div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: LISTADO DE ARTÍCULOS -->
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-0">
                                <h6 class="text-uppercase text-muted fw-bold p-3 mb-0" style="font-size: 0.75rem; letter-spacing: 1px;">Listado de Artículos</h6>
                                <div class="table-responsive">
                                    <table class="table table-sm table-hover mb-0 align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th class="ps-3">Artículo</th>
                                                <th class="text-center" style="width: 70px;">Cant.</th>
                                                <th class="text-end" style="width: 100px;">Costo</th>
                                                <th class="text-end" style="width: 100px;">Subtotal</th>
                                                <th class="text-end" style="width: 80px;">IVA</th>
                                                <th class="text-end pe-3" style="width: 100px;">Importe</th>
                                            </tr>
                                        </thead>
                                        <tbody id="ver_compra_tabla_cuerpo">
                                            <!-- JS insertará filas aquí -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="card-footer bg-white border-0 py-3">
                                <div class="row justify-content-end">
                                    <div class="col-md-5">
                                        <div class="d-flex justify-content-between mb-1">
                                            <span class="text-muted small">Subtotal:</span>
                                            <span class="fw-semibold text-dark" id="ver_compra_subtotal">$0.00</span>
                                        </div>
                                        <div class="d-flex justify-content-between mb-1">
                                            <span class="text-muted small">Descuento:</span>
                                            <span class="fw-semibold text-dark" id="ver_compra_descuento">$0.00</span>
                                        </div>
                                        <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                                            <span class="text-muted small">IVA:</span>
                                            <span class="fw-semibold text-dark" id="ver_compra_iva_total">$0.00</span>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <span class="text-muted fw-bold small uppercase">Total OC:</span>
                                            <span class="fw-bold fs-4 text-brand" id="ver_compra_gran_total">$0.00</span>
                                        </div>
                                        <!-- TOTAL EN PESOS (SI ES USD) -->
                                        <div id="ver_compra_pesos_wrapper" class="d-none border-top pt-2 mt-2">
                                            <div class="d-flex justify-content-between align-items-center">
                                                <span class="text-muted small">Total en Pesos (MXN):</span>
                                                <span class="text-dark" id="ver_compra_total_pesos">$0.00</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- COLUMNA DERECHA: SEGUIMIENTO Y MOVIMIENTOS -->
                    <div class="col-seguimiento-sidebar">
                        <div class="card border-0 shadow-sm h-100 d-flex flex-column bg-white">
                            <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-dark small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                                    <i class="bi bi-clock-history me-1 text-brand"></i> Movimientos y Seguimiento
                                </span>
                                <span class="badge bg-light text-secondary border font-monospace" id="ver_compra_historial_count">0</span>
                            </div>
                            <div class="card-body p-3 flex-grow-1" id="ver_compra_contenedor_historial" style="max-height: 560px; overflow-y: auto;">
                                <!-- Se llena dinámicamente vía JS -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer border-top bg-white">
                <button type="button" class="btn btn-brand btn-sm text-white px-4" data-bs-dismiss="modal">Cerrar</button>
            </div>

        </div>
    </div>
</div>
