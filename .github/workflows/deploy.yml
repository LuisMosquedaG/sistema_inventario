name: Deploy to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srv1254281.hstgr.cloud
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/django/sistema_inventario
            git fetch origin
            git reset --hard origin/main
            mkdir -p media
            chmod -R 775 media
            /var/www/django/sistema_inventario/venv/bin/pip install -r requirements.txt
            /var/www/django/sistema_inventario/venv/bin/python manage.py migrate --noinput
            /var/www/django/sistema_inventario/venv/bin/python manage.py collectstatic --clear --noinput
            pkill -9 -x gunicorn || true
            sudo supervisorctl restart sistema_inventario || sudo supervisorctl start sistema_inventario
            sleep 3
            sudo supervisorctl status sistema_inventario || true
            sudo systemctl reload nginx || sudo service nginx reload || true
            echo "=== DESPLIEGUE FINALIZADO EXITOSAMENTE ==="

